<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PTE Academic 词汇学习工具 - 简单闪卡">
  <title>PTE Vocab Learner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }
    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .card-container {
      width: 100%;
      max-width: 480px;
      perspective: 1000px;
      margin-bottom: 24px;
    }
    .card {
      width: 100%;
      height: 280px;
      position: relative;
      transition: transform 0.5s;
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #1e293b, #0f172a);
    }
    .word {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }
    .meaning {
      font-size: 1.25rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .hint {
      position: absolute;
      bottom: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-know {
      background: var(--success);
    }
    .btn-unknow {
      background: var(--danger);
    }
    .btn-next, .btn-shuffle, .btn-reset {
      background: var(--primary);
    }
    .secondary-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }
    .secondary-controls button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.875rem;
      padding: 10px;
    }
    .progress-bar {
      width: 100%;
      max-width: 480px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s;
    }
    footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>PTE Vocab Learner</h1>
    <p class="subtitle">学术高频词 · 闪卡练习</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="known-count">0</div>
      <div class="stat-label">已掌握</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="current-index">1</div>
      <div class="stat-label">当前</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-label">总词数</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="card-container">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="word" id="word-en">Loading...</div>
        <div class="hint">点击卡片查看释义</div>
      </div>
      <div class="card-face card-back">
        <div class="word" id="word-en-back"></div>
        <div class="meaning" id="word-zh"></div>
        <div class="hint">再次点击返回</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-unknow" onclick="markUnknown()">还不熟</button>
    <button class="btn-know" onclick="markKnown()">已掌握</button>
  </div>

  <div class="secondary-controls">
    <button class="btn-shuffle" onclick="shuffleWords()">🔀 打乱</button>
    <button class="btn-next" onclick="nextWord()">下一个 →</button>
    <button class="btn-reset" onclick="resetProgress()">重置</button>
  </div>

  <footer>
    <p>数据来源：Academic Word List + PTE 高频词整理</p>
    <p>推荐进阶工具：<a href="https://github.com/RealKai42/qwerty-learner" target="_blank">qwerty-learner</a> · <a href="https://github.com/1745761934/pte-3000-words" target="_blank">pte-3000-words</a></p>
  </footer>

  <script src="words.js"></script>
  <script>
    let currentList = [];
    let index = 0;
    let known = new Set();
    const STORAGE_KEY = 'pte-vocab-known';

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) known = new Set(JSON.parse(saved));
      } catch (e) {}
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...known]));
    }

    function init() {
      loadProgress();
      currentList = [...words];
      shuffleArray(currentList);
      index = 0;
      updateUI();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function updateUI() {
      if (currentList.length === 0) return;
      const w = currentList[index];
      document.getElementById('word-en').textContent = w.en;
      document.getElementById('word-en-back').textContent = w.en;
      document.getElementById('word-zh').textContent = w.zh;
      document.getElementById('card').classList.remove('flipped');

      document.getElementById('known-count').textContent = known.size;
      document.getElementById('current-index').textContent = index + 1;
      document.getElementById('total-count').textContent = currentList.length;

      const progress = ((index + 1) / currentList.length) * 100;
      document.getElementById('progress').style.width = progress + '%';
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextWord() {
      index = (index + 1) % currentList.length;
      updateUI();
    }

    function markKnown() {
      const w = currentList[index];
      known.add(w.en);
      saveProgress();
      nextWord();
    }

    function markUnknown() {
      const w = currentList[index];
      known.delete(w.en);
      saveProgress();
      nextWord();
    }

    function shuffleWords() {
      shuffleArray(currentList);
      index = 0;
      updateUI();
    }

    function resetProgress() {
      if (confirm('确定要清除所有学习进度吗？')) {
        known.clear();
        saveProgress();
        shuffleWords();
      }
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        flipCard();
      } else if (e.key === 'ArrowRight' || e.key === 'n') {
        nextWord();
      } else if (e.key === '1') {
        markUnknown();
      } else if (e.key === '2') {
        markKnown();
      }
    });

    init();
  </script>
</body>
</html>
