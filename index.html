<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PTE Academic 词汇闯关学习工具">
  <title>PTE Vocab Learner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .screen { display: none; max-width: 480px; margin: 0 auto; }
    .screen.active { display: block; }

    /* ===== Home / Level Map ===== */
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.875rem; }
    .level-list { display: flex; flex-direction: column; gap: 12px; }
    .level-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-card:active { transform: scale(0.98); }
    .level-card.locked { opacity: 0.5; cursor: not-allowed; }
    .level-num {
      width: 42px; height: 42px;
      background: var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    }
    .level-card.locked .level-num { background: var(--border); }
    .level-info { flex: 1; }
    .level-title { font-weight: 600; margin-bottom: 2px; }
    .level-meta { font-size: 0.8rem; color: var(--muted); }
    .stars { color: var(--warning); font-size: 1.1rem; letter-spacing: 2px; }

    /* ===== Practice Screen ===== */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .back-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 8px 14px; border-radius: 10px;
      font-size: 0.9rem; cursor: pointer;
    }
    .progress-text { font-size: 0.9rem; color: var(--muted); }
    .progress-bar {
      height: 6px; background: var(--border); border-radius: 3px;
      margin-bottom: 20px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

    /* Card */
    .card-container { perspective: 1000px; margin-bottom: 20px; }
    .card {
      width: 100%; height: 240px; position: relative;
      transition: transform 0.45s; transform-style: preserve-3d; cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 16px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; border: 1px solid var(--border); background: var(--card);
    }
    .card-back { transform: rotateY(180deg); background: linear-gradient(145deg, #1e293b, #0f172a); }
    .word { font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .meaning { font-size: 1.15rem; color: var(--muted); text-align: center; }
    .speak-btn {
      margin-top: 12px; background: transparent; border: 1px solid var(--border);
      color: var(--text); width: 44px; height: 44px; border-radius: 50%;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
    }

    /* Multiple Choice */
    .mc-question { text-align: center; margin-bottom: 20px; }
    .mc-word { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .mc-options { display: flex; flex-direction: column; gap: 10px; }
    .mc-option {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; text-align: left;
      font-size: 1rem; cursor: pointer; transition: all 0.15s;
    }
    .mc-option:active { transform: scale(0.98); }
    .mc-option.correct { background: rgba(34,197,94,0.2); border-color: var(--success); }
    .mc-option.wrong { background: rgba(239,68,68,0.2); border-color: var(--danger); }

    /* Buttons */
    .controls { display: flex; gap: 12px; margin-bottom: 12px; }
    .controls button, .action-btn {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; color: white;
    }
    .btn-know { background: var(--success); }
    .btn-unknow { background: var(--danger); }
    .btn-primary { background: var(--primary); }
    .btn-secondary {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
    }
    .controls button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Result */
    .result-box {
      background: var(--card); border-radius: 16px; padding: 28px 20px;
      text-align: center; border: 1px solid var(--border);
    }
    .result-stars { font-size: 2.5rem; color: var(--warning); margin: 12px 0; letter-spacing: 6px; }
    .result-score { font-size: 1.3rem; margin-bottom: 8px; }
    .result-msg { color: var(--muted); margin-bottom: 24px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- ===== Level Map ===== -->
  <div id="home" class="screen active">
    <header>
      <h1>PTE Vocab Learner</h1>
      <p class="subtitle">闯关模式 · 学术高频词</p>
    </header>
    <div id="level-list" class="level-list"></div>
  </div>

  <!-- ===== Practice ===== -->
  <div id="practice" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="backToHome()">← 返回</button>
      <div class="progress-text" id="practice-progress">1 / 25</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="practice-bar"></div></div>

    <!-- Flashcard Mode -->
    <div id="mode-flashcard">
      <div class="card-container">
        <div class="card" id="card" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="word" id="word-en">...</div>
            <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊</button>
          </div>
          <div class="card-face card-back">
            <div class="word" id="word-en-back"></div>
            <div class="meaning" id="word-zh"></div>
            <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-unknow" id="btn-unknow" onclick="answerFlash(false)">还不熟</button>
        <button class="btn-know" id="btn-know" onclick="answerFlash(true)">已掌握</button>
      </div>
    </div>

    <!-- Multiple Choice Mode -->
    <div id="mode-mc" class="hidden">
      <div class="mc-question">
        <div class="mc-word" id="mc-word">...</div>
        <button class="speak-btn" style="margin: 8px auto;" onclick="speakWord()">🔊</button>
        <div style="color:var(--muted);font-size:0.9rem;margin-top:4px;">选择正确的中文意思</div>
      </div>
      <div class="mc-options" id="mc-options"></div>
    </div>
  </div>

  <!-- ===== Result ===== -->
  <div id="result" class="screen">
    <div class="result-box">
      <div style="font-size:1.4rem;font-weight:700;">关卡完成！</div>
      <div class="result-stars" id="result-stars">★★★</div>
      <div class="result-score" id="result-score">正确率 90%</div>
      <div class="result-msg" id="result-msg">太棒了，继续保持！</div>
      <button class="action-btn btn-primary" onclick="backToHome()" style="width:100%;">返回关卡列表</button>
    </div>
  </div>

  <script src="words.js"></script>
  <script>
    const LEVEL_SIZE = 25;
    const STORAGE_KEY = 'pte-vocab-levels-v2';

    let levels = [];
    let currentLevelIndex = 0;
    let currentWords = [];
    let currentIndex = 0;
    let correctCount = 0;
    let mode = 'flash'; // 'flash' or 'mc'
    let levelProgress = {}; // { 0: {stars: 2, best: 85}, ... }
    let isAnswering = false;

    // ---------- Init ----------
    function init() {
      // Split words into levels
      levels = [];
      for (let i = 0; i < words.length; i += LEVEL_SIZE) {
        levels.push(words.slice(i, i + LEVEL_SIZE));
      }

      // Load progress
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) levelProgress = JSON.parse(saved);
      } catch(e) {}

      renderLevelList();
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(levelProgress));
    }

    // ---------- Level List ----------
    function renderLevelList() {
      const list = document.getElementById('level-list');
      list.innerHTML = '';

      levels.forEach((lvWords, i) => {
        const prog = levelProgress[i] || { stars: 0, best: 0 };
        const unlocked = i === 0 || (levelProgress[i-1] && levelProgress[i-1].stars >= 1);

        const card = document.createElement('div');
        card.className = 'level-card' + (unlocked ? '' : ' locked');
        card.onclick = () => { if (unlocked) startLevel(i); };

        const starsStr = prog.stars > 0 ? '★'.repeat(prog.stars) + '☆'.repeat(3 - prog.stars) : '☆☆☆';

        card.innerHTML = `
          <div class="level-num">${i + 1}</div>
          <div class="level-info">
            <div class="level-title">第 ${i + 1} 关</div>
            <div class="level-meta">${lvWords.length} 个单词${prog.best ? ' · 最高 ' + prog.best + '%' : ''}</div>
          </div>
          <div class="stars">${starsStr}</div>
        `;
        list.appendChild(card);
      });
    }

    // ---------- Start Level ----------
    function startLevel(levelIdx) {
      currentLevelIndex = levelIdx;
      currentWords = [...levels[levelIdx]];
      // Shuffle
      for (let i = currentWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
      }
      currentIndex = 0;
      correctCount = 0;
      isAnswering = false;

      showScreen('practice');
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIndex >= currentWords.length) {
        finishLevel();
        return;
      }

      isAnswering = false;
      // Re-enable buttons
      document.getElementById('btn-unknow').disabled = false;
      document.getElementById('btn-know').disabled = false;

      // Alternate modes: roughly 60% flash, 40% MC
      mode = Math.random() < 0.6 ? 'flash' : 'mc';

      document.getElementById('mode-flashcard').classList.toggle('hidden', mode !== 'flash');
      document.getElementById('mode-mc').classList.toggle('hidden', mode !== 'mc');

      const w = currentWords[currentIndex];
      document.getElementById('practice-progress').textContent = `${currentIndex + 1} / ${currentWords.length}`;
      document.getElementById('practice-bar').style.width = ((currentIndex) / currentWords.length * 100) + '%';

      if (mode === 'flash') {
        document.getElementById('word-en').textContent = w.en;
        document.getElementById('word-en-back').textContent = w.en;
        document.getElementById('word-zh').textContent = w.zh;
        document.getElementById('card').classList.remove('flipped');
      } else {
        // Multiple choice
        document.getElementById('mc-word').textContent = w.en;
        const options = generateOptions(w);
        const box = document.getElementById('mc-options');
        box.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('div');
          btn.className = 'mc-option';
          btn.textContent = opt.zh;
          btn.onclick = () => selectOption(btn, opt.correct);
          box.appendChild(btn);
        });
      }
    }

    function generateOptions(correctWord) {
      const opts = [{ zh: correctWord.zh, correct: true }];
      const used = new Set([correctWord.zh]);

      while (opts.length < 4) {
        const rand = words[Math.floor(Math.random() * words.length)];
        if (!used.has(rand.zh)) {
          used.add(rand.zh);
          opts.push({ zh: rand.zh, correct: false });
        }
      }
      // Shuffle
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      return opts;
    }

    function selectOption(btn, isCorrect) {
      // Prevent multiple clicks
      const all = document.querySelectorAll('.mc-option');
      all.forEach(b => b.onclick = null);

      if (isCorrect) {
        btn.classList.add('correct');
        correctCount++;
      } else {
        btn.classList.add('wrong');
        // Highlight correct one
        all.forEach(b => {
          if (b.textContent === currentWords[currentIndex].zh) b.classList.add('correct');
        });
      }

      setTimeout(() => {
        currentIndex++;
        nextQuestion();
      }, 700);
    }

    function answerFlash(known) {
      if (isAnswering) return;
      isAnswering = true;

      // Disable buttons to prevent double tap
      document.getElementById('btn-unknow').disabled = true;
      document.getElementById('btn-know').disabled = true;

      if (known) correctCount++;

      const card = document.getElementById('card');
      // If not flipped yet, flip to show meaning
      if (!card.classList.contains('flipped')) {
        card.classList.add('flipped');
      }

      // Wait 1.1 seconds so user can see the translation, then next
      setTimeout(() => {
        currentIndex++;
        nextQuestion();
      }, 1100);
    }

    function flipCard() {
      if (isAnswering) return; // prevent flipping while waiting
      document.getElementById('card').classList.toggle('flipped');
    }

    function speakWord() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const w = currentWords[currentIndex];
      const u = new SpeechSynthesisUtterance(w.en);
      u.lang = 'en-US';
      u.rate = 0.85;
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Google') || v.name.includes('US'))) || voices.find(v => v.lang.startsWith('en'));
      if (preferred) u.voice = preferred;
      speechSynthesis.speak(u);
    }

    // ---------- Finish Level ----------
    function finishLevel() {
      const total = currentWords.length;
      const rate = Math.round((correctCount / total) * 100);
      let stars = 0;
      if (rate >= 90) stars = 3;
      else if (rate >= 70) stars = 2;
      else if (rate >= 50) stars = 1;

      // Update best
      const prev = levelProgress[currentLevelIndex] || { stars: 0, best: 0 };
      levelProgress[currentLevelIndex] = {
        stars: Math.max(prev.stars, stars),
        best: Math.max(prev.best, rate)
      };
      saveProgress();

      // Show result
      document.getElementById('result-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      document.getElementById('result-score').textContent = `正确率 ${rate}%  (${correctCount}/${total})`;
      document.getElementById('result-msg').textContent =
        stars === 3 ? '完美！太强了 🔥' :
        stars === 2 ? '不错哦，继续加油！' :
        stars === 1 ? '及格了，再练一遍会更好' : '再试一次，你可以的！';

      showScreen('result');
    }

    function backToHome() {
      renderLevelList();
      showScreen('home');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Preload voices
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    init();
  </script>
</body>
</html>
